<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Alerts App</title>
    <style>
        .hidden { display: none; }
        .error { color: red; font-weight: bold; margin-top: 10px; }
        .summary { font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>National Weather Alerts</h1>
    <div>
        <input type="text" id="state-input" placeholder="Enter state abbreviation" maxlength="2">
        <button id="get-alerts-btn">Get Weather Alerts</button>
    </div>
    <div id="error-message" class="error hidden"></div>
    <div id="results-container">
        <div id="alerts-display">
            <div id="alerts-summary" class="summary"></div>
            <ul id="alerts-list"></ul>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
